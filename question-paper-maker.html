<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রশ্নপত্র তৈরির অ্যাপ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
  /* SolaimanLipi restricted to the Bengali unicode block only, so any
     English letters in the same text automatically fall back to Times New Roman */
  @font-face{
    font-family:'SolaimanLipi';
    font-display:swap;
    font-weight:400;
    src:url('https://fonts.maateen.me/solaiman-lipi/solaimanlipi-normal-v1.0.woff2') format('woff2'),
        url('https://fonts.maateen.me/solaiman-lipi/solaimanlipi-normal-v1.0.ttf') format('truetype');
    unicode-range:U+0980-09FF;
  }
  @font-face{
    font-family:'SolaimanLipi';
    font-display:swap;
    font-weight:700;
    src:url('https://fonts.maateen.me/solaiman-lipi/solaimanlipi-bold-v1.0.woff2') format('woff2'),
        url('https://fonts.maateen.me/solaiman-lipi/solaimanlipi-bold-v1.0.ttf') format('truetype');
    unicode-range:U+0980-09FF;
  }
</style>
<style>
  :root{
    --ink:#2b2420;
    --maroon:#7a2e2e;
    --maroon-dark:#5c2222;
    --paper:#f8f4e9;
    --paper-line:#d8cdb2;
    --panel:#20342a;
    --panel-2:#28402f;
    --panel-accent:#c9a24b;
    --panel-text:#eef1ea;
    --muted:#8a8f86;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Hind Siliguri', sans-serif;
    background:#12201a;
    color:var(--ink);
    min-height:100vh;
  }
  .app{
    display:grid;
    grid-template-columns: 400px 1fr;
    min-height:100vh;
  }
  /* ---------- EDITOR PANEL ---------- */
  .editor{
    background: var(--panel);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(201,162,75,0.10), transparent 45%);
    color:var(--panel-text);
    padding:28px 26px 60px;
    overflow-y:auto;
    max-height:100vh;
  }
  .editor-title{
    font-family:'Baloo Da 2', sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--panel-accent);
    letter-spacing:0.3px;
    margin:0 0 4px;
  }
  .editor-sub{
    font-size:13px;
    color:#a9b3a5;
    margin:0 0 26px;
  }
  .section-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--panel-accent);
    font-weight:600;
    margin:26px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(201,162,75,0.25);
  }
  .field{
    margin-bottom:12px;
  }
  .field label{
    display:block;
    font-size:12.5px;
    color:#b7c0b3;
    margin-bottom:5px;
  }
  .field input, .field textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid rgba(201,162,75,0.22);
    color:var(--panel-text);
    border-radius:7px;
    padding:9px 11px;
    font-family:'Hind Siliguri', sans-serif;
    font-size:14.5px;
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus, .field textarea:focus{
    border-color:var(--panel-accent);
  }
  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .qcard{
    background:var(--panel-2);
    border:1px solid rgba(201,162,75,0.18);
    border-radius:9px;
    padding:12px 12px 10px;
    margin-bottom:10px;
    position:relative;
  }
  .qcard-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .qnum-badge{
    width:24px;height:24px;
    border-radius:50%;
    background:var(--panel-accent);
    color:#20342a;
    font-weight:700;
    font-size:12.5px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Hind Siliguri', sans-serif;
  }
  .qcard textarea{
    width:100%;
    min-height:52px;
    resize:vertical;
    background:#1b2c22;
    border:1px solid rgba(201,162,75,0.16);
    color:var(--panel-text);
    border-radius:6px;
    padding:8px 9px;
    font-family:'Hind Siliguri', sans-serif;
    font-size:14px;
    outline:none;
  }
  .qcard textarea.math-mode{
    font-family:'Courier New', monospace;
    white-space:pre;
  }
  .math-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    color:#b7c0b3;
    margin:8px 0;
  }
  .math-toggle input{
    accent-color:var(--panel-accent);
  }
  .math-tools{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:8px;
  }
  .math-tool-btn{
    background:#1b2c22;
    border:1px solid rgba(201,162,75,0.3);
    color:var(--panel-accent);
    border-radius:6px;
    padding:5px 9px;
    font-size:12.5px;
    cursor:pointer;
    font-family:'Hind Siliguri', sans-serif;
  }
  .math-tool-btn:hover{background:rgba(201,162,75,0.12);}
  .math-hint{
    font-size:11.5px;
    color:#8a9587;
    margin:0 0 8px;
    line-height:1.4;
  }
  .qcard-bottom{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
  }
  .marks-input{
    width:64px;
    background:#1b2c22;
    border:1px solid rgba(201,162,75,0.16);
    color:var(--panel-text);
    border-radius:6px;
    padding:6px 8px;
    font-size:13.5px;
    text-align:center;
  }
  .marks-label{
    font-size:12px;
    color:#98a394;
  }
  .del-btn{
    margin-left:auto;
    background:none;
    border:1px solid rgba(220,120,120,0.4);
    color:#e39b9b;
    border-radius:6px;
    padding:5px 10px;
    font-size:12px;
    cursor:pointer;
    font-family:'Hind Siliguri', sans-serif;
  }
  .del-btn:hover{background:rgba(220,120,120,0.12);}
  .add-btn{
    width:100%;
    background:transparent;
    border:1.5px dashed rgba(201,162,75,0.4);
    color:var(--panel-accent);
    border-radius:8px;
    padding:10px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:'Hind Siliguri', sans-serif;
    margin-top:4px;
  }
  .add-btn:hover{background:rgba(201,162,75,0.08);}

  .totals{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:18px 0 4px;
    padding:10px 12px;
    background:rgba(201,162,75,0.08);
    border-radius:8px;
    font-size:13.5px;
  }
  .totals b{color:var(--panel-accent); font-size:16px;}
  .totals.mismatch b{color:#e39b9b;}

  .draft-row{
    display:flex;
    gap:8px;
    margin-top:18px;
  }
  .draft-btn{
    flex:1;
    background:var(--panel-2);
    color:var(--panel-accent);
    border:1px solid rgba(201,162,75,0.35);
    border-radius:8px;
    padding:10px 8px;
    font-family:'Hind Siliguri', sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
  }
  .draft-btn:hover{background:rgba(201,162,75,0.1);}
  .draft-status{
    font-size:12.5px;
    color:#a9b3a5;
    min-height:16px;
    margin:8px 2px 0;
    text-align:center;
  }
  .pdf-btn{
    position:sticky;
    bottom:0;
    width:100%;
    margin-top:22px;
    background:linear-gradient(135deg, var(--maroon), var(--maroon-dark));
    color:#f8f4e9;
    border:none;
    border-radius:9px;
    padding:14px;
    font-family:'Baloo Da 2', sans-serif;
    font-weight:700;
    font-size:16.5px;
    letter-spacing:0.3px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
  }
  .pdf-btn:hover{filter:brightness(1.08);}

  /* ---------- PREVIEW PANEL ---------- */
  .preview-wrap{
    background:#12201a;
    padding:44px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow-y:auto;
    max-height:100vh;
  }
  #paper{
    width:794px;
    min-height:1123px;
    background:var(--paper);
    background-image:
      radial-gradient(ellipse at top, rgba(122,46,46,0.04), transparent 60%);
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    padding:56px 64px 70px;
    color:var(--ink);
    position:relative;
  }
  #paper{
    font-family:'SolaimanLipi','Times New Roman',Times,serif;
  }
  .p-head{
    text-align:center;
    margin-bottom:6px;
  }
  .p-institute{
    font-family:'SolaimanLipi','Times New Roman',Times,serif;
    font-weight:700;
    font-size:25px;
    color:#000;
    margin:0;
    letter-spacing:0.3px;
  }
  .p-address{
    font-size:18px;
    margin:4px 0 0;
    color:#000;
  }
  .p-exam{
    font-size:18px;
    font-weight:700;
    margin:8px 0 0;
    color:#000;
  }
  .p-classline{
    font-size:18px;
    margin:6px 0 0;
    color:#000;
  }
  .p-meta{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin:22px 0 6px;
    font-size:16px;
    font-weight:700;
  }
  .p-divider{
    border:none;
    border-top:2px solid var(--maroon-dark);
    margin:0 0 26px;
  }
  .p-questions{
    display:flex;
    flex-direction:column;
    gap:24px;
  }
  .p-qrow{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
  }
  .p-qtext{
    font-size:16px;
    line-height:1.7;
    flex:1;
  }
  .p-qtext .qn{
    font-weight:700;
    margin-right:2px;
  }
  .p-mathblock{
    white-space:pre;
    font-family:'SolaimanLipi','Courier New',monospace;
    letter-spacing:1px;
    font-size:16px;
    line-height:1.5;
    display:inline-block;
    margin-top:6px;
    vertical-align:top;
  }
  .p-qmarks{
    font-size:16px;
    font-weight:700;
    white-space:nowrap;
    min-width:34px;
    text-align:right;
  }
  .p-footer{
    margin-top:56px;
    text-align:center;
  }
  .p-arabic{
    font-family:'Amiri Quran', serif;
    font-size:16px;
    direction:rtl;
    color:#000;
  }
  .p-empty-hint{
    color:#b3a98c;
    font-style:italic;
    font-size:14px;
    text-align:center;
    padding:20px;
  }

  @page{
    size: A4;
    margin: 0;
  }
  @media print{
    html, body{
      width:210mm;
      height:297mm;
      margin:0;
      background:#fff;
    }
    .editor{display:none;}
    .preview-wrap{
      padding:0;
      background:#fff;
      max-height:none;
      overflow:visible;
      display:block;
    }
    .app{display:block;}
    #paper{
      box-shadow:none;
      width:210mm;
      height:297mm;
      min-height:auto;
      max-height:297mm;
      margin:0;
      padding:14mm 15mm 12mm;
      overflow:hidden;
      page-break-after:avoid;
    }
  }

  @media (max-width: 900px){
    .app{grid-template-columns:1fr;}
    .preview-wrap{padding:20px;}
    #paper{width:100%;padding:32px 24px 44px;}
    .editor{max-height:none;}
    .preview-wrap{max-height:none;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- EDITOR -->
  <div class="editor">
    <p class="editor-title">প্রশ্নপত্র তৈরির অ্যাপ</p>
    <p class="editor-sub">তথ্য পূরণ করো, ডান পাশে সরাসরি প্রিভিউ দেখতে পাবে। শেষে পিডিএফ ডাউনলোড করো।</p>

    <div class="section-label">প্রতিষ্ঠানের তথ্য</div>
    <div class="field">
      <label>প্রতিষ্ঠানের নাম</label>
      <input id="institute" type="text" value="দারুস সালিম ইন্টারন্যাশনাল মাদ্রাসা">
    </div>
    <div class="field">
      <label>ঠিকানা</label>
      <input id="address" type="text" value="কালুশাহ্ সড়ক, বরিশাল সদর, বরিশাল">
    </div>
    <div class="field">
      <label>পরীক্ষার নাম</label>
      <input id="examname" type="text" value="প্রথম সাময়িক পরীক্ষা - ২০২৬ইং">
    </div>
    <div class="row2">
      <div class="field">
        <label>শ্রেণি</label>
        <input id="classname" type="text" value="তৃতীয়">
      </div>
      <div class="field">
        <label>বিষয়</label>
        <input id="subject" type="text" value="আরবী ১ম">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>সময়</label>
        <input id="time" type="text" value="২ ঘন্টা">
      </div>
      <div class="field">
        <label>পূর্ণমান</label>
        <input id="fullmarks" type="text" value="১০০">
      </div>
    </div>

    <div class="section-label">প্রশ্নসমূহ</div>
    <div id="qlist"></div>
    <button class="add-btn" id="addQ">+ নতুন প্রশ্ন যোগ করো</button>

    <div class="totals" id="totalsBox">
      <span>মোট নম্বর যোগফল</span>
      <b id="totalsText">০</b>
    </div>

    <div class="section-label">নিচের লাইন (ঐচ্ছিক)</div>
    <div class="field">
      <label>আরবি/উর্দু আয়াত বা লেখা (ঐচ্ছিক)</label>
      <input id="arabicline" type="text" value="قَالُوا طَائِرُكُم مَعَكُم أَئِن ذُكِرتُم بَل أَنتُم قَوم مُسرِفُونَ">
    </div>

    <div class="draft-row">
      <button class="draft-btn" id="saveDraftBtn">খসড়া সেভ করো</button>
      <button class="draft-btn" id="loadDraftBtn">খসড়া লোড করো</button>
    </div>
    <p class="draft-status" id="draftStatus"></p>

    <button class="pdf-btn" id="downloadBtn">পিডিএফ ডাউনলোড করো</button>
  </div>

  <!-- PREVIEW -->
  <div class="preview-wrap">
    <div id="paper">
      <div class="p-head">
        <p class="p-institute" id="pv-institute"></p>
        <p class="p-address" id="pv-address"></p>
        <p class="p-exam" id="pv-exam"></p>
        <p class="p-classline" id="pv-classline"></p>
      </div>
      <div class="p-meta">
        <span id="pv-time"></span>
        <span id="pv-fullmarks"></span>
      </div>
      <hr class="p-divider">
      <div class="p-questions" id="pv-questions"></div>
      <div class="p-footer" id="pv-footer"></div>
    </div>
  </div>

</div>

<script>
const banglaDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
function toBangla(input){
  return String(input).replace(/[0-9]/g, d => banglaDigits[d]);
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let questions = [
  {text:"আউজুবিল্লা বিসমিল্লাহসহ সূরা বাকারার শেষ আয়াত লিখ।", marks:"১৫", math:false},
  {text:"সূরা নাসর হরকত দিয়ে সুন্দর করে লিখ।", marks:"২০", math:false},
  {text:"দুরুদ শরীফ সুন্দর করে লিখ।", marks:"১৫", math:false},
  {text:"ঈমানি মুজমাল অর্থসহ সুন্দর করে লিখ।", marks:"২০", math:false},
  {text:"আসমাউল হুসনা থেকে ১০ পর্যন্ত লিখ।", marks:"২০", math:false},
  {text:"হরকত লাগাও:", marks:"১০", math:false},
];

const qlist = document.getElementById('qlist');
const totalsText = document.getElementById('totalsText');
const totalsBox = document.getElementById('totalsBox');

// Builds a right-aligned column block (addition/subtraction/multiplication)
// e.g. for a=245, b=38, op="+":
//    ২৪৫
// +  ৩৮
// ──────
function buildColumnBlock(a, b, op){
  const opSymbol = op === '+' ? '+' : op === '-' ? '−' : '×';
  const lineA = a.trim();
  const lineB = opSymbol + ' ' + b.trim();
  const width = Math.max(lineA.length, lineB.length) + 1;
  const rule = '─'.repeat(width + 1);
  return toBangla(lineA.padStart(width)) + '\n' + toBangla(lineB.padStart(width)) + '\n' + rule;
}

// Division doesn't have a clean plain-text bracket form, so it's written
// horizontally, which is how it's usually phrased in question papers anyway.
function buildDivisionLine(a, b){
  return toBangla(a.trim()) + ' ÷ ' + toBangla(b.trim()) + ' = ';
}

function insertMathTemplate(idx, op){
  const a = prompt(op === '÷' ? 'ভাজ্য সংখ্যাটি লিখো (যেমন 245):' : 'উপরের সংখ্যাটি লিখো (যেমন 245):');
  if(a === null || a.trim() === '') return;
  const b = prompt(op === '÷' ? 'ভাজক সংখ্যাটি লিখো (যেমন 5):' : 'নিচের সংখ্যাটি লিখো (যেমন 38):');
  if(b === null || b.trim() === '') return;
  const block = op === '÷' ? buildDivisionLine(a, b) : buildColumnBlock(a, b, op);
  const textarea = qlist.querySelector(`textarea[data-idx="${idx}"]`);
  const existing = questions[idx].text || '';
  const sep = existing.trim() ? existing.replace(/\s+$/, '') + '\n\n' : '';
  questions[idx].text = sep + block;
  if(textarea) textarea.value = questions[idx].text;
  renderPreview();
}

function renderEditor(){
  qlist.innerHTML = '';
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = `
      <div class="qcard-top">
        <span class="qnum-badge">${toBangla(i+1)}</span>
      </div>
      <textarea class="${q.math ? 'math-mode' : ''}" data-idx="${i}" data-field="text" placeholder="প্রশ্নটি লিখো...">${q.text}</textarea>
      <label class="math-toggle">
        <input type="checkbox" data-idx="${i}" data-field="math" ${q.math ? 'checked' : ''}>
        গাণিতিক (সংখ্যা নিচে নিচে সাজিয়ে লিখতে চাই)
      </label>
      ${q.math ? `
      <div class="math-tools">
        <button type="button" class="math-tool-btn" data-idx="${i}" data-op="+">+ যোগ বসাও</button>
        <button type="button" class="math-tool-btn" data-idx="${i}" data-op="-">− বিয়োগ বসাও</button>
        <button type="button" class="math-tool-btn" data-idx="${i}" data-op="×">× গুণ বসাও</button>
        <button type="button" class="math-tool-btn" data-idx="${i}" data-op="÷">÷ ভাগ বসাও</button>
      </div>
      <p class="math-hint">ভাগ অনুভূমিকভাবে (÷ প্রতীক দিয়ে) বসবে, বাকিগুলো নিচে নিচে সাজানো থাকবে।</p>
      ` : ''}
      <div class="qcard-bottom">
        <span class="marks-label">নম্বর:</span>
        <input class="marks-input" data-idx="${i}" data-field="marks" type="text" value="${q.marks}">
        <button class="del-btn" data-idx="${i}">মুছে ফেলো</button>
      </div>
    `;
    qlist.appendChild(card);
  });

  qlist.querySelectorAll('textarea, input.marks-input').forEach(el => {
    el.addEventListener('input', e => {
      const idx = +e.target.dataset.idx;
      const field = e.target.dataset.field;
      questions[idx][field] = e.target.value;
      renderPreview();
      updateTotals();
    });
  });
  qlist.querySelectorAll('input[data-field="math"]').forEach(el => {
    el.addEventListener('change', e => {
      const idx = +e.target.dataset.idx;
      questions[idx].math = e.target.checked;
      renderEditor();
      renderPreview();
    });
  });
  qlist.querySelectorAll('.math-tool-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = +e.target.dataset.idx;
      const op = e.target.dataset.op;
      insertMathTemplate(idx, op);
    });
  });
  qlist.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = +e.target.dataset.idx;
      questions.splice(idx, 1);
      renderEditor();
      renderPreview();
      updateTotals();
    });
  });
}

function banglaToNumber(s){
  const engStr = String(s).replace(/[০-৯]/g, d => banglaDigits.indexOf(d));
  const n = parseFloat(engStr);
  return isNaN(n) ? 0 : n;
}

function updateTotals(){
  const sum = questions.reduce((acc, q) => acc + banglaToNumber(q.marks), 0);
  const full = banglaToNumber(document.getElementById('fullmarks').value);
  totalsText.textContent = toBangla(sum) + (full ? ' / ' + toBangla(full) : '');
  totalsBox.classList.toggle('mismatch', full && sum !== full);
}

function renderPreview(){
  document.getElementById('pv-institute').textContent = document.getElementById('institute').value;
  document.getElementById('pv-address').textContent = document.getElementById('address').value;
  document.getElementById('pv-exam').textContent = document.getElementById('examname').value;
  document.getElementById('pv-classline').textContent =
    'শ্রেণি: ' + document.getElementById('classname').value + ' , বিষয়: ' + document.getElementById('subject').value;
  document.getElementById('pv-time').textContent = 'সময়: ' + document.getElementById('time').value;
  document.getElementById('pv-fullmarks').textContent = 'পূর্ণমান: ' + document.getElementById('fullmarks').value;

  const qwrap = document.getElementById('pv-questions');
  qwrap.innerHTML = '';
  if(questions.length === 0){
    qwrap.innerHTML = '<div class="p-empty-hint">এখনো কোনো প্রশ্ন যোগ করা হয়নি।</div>';
  } else {
    questions.forEach((q, i) => {
      const row = document.createElement('div');
      row.className = 'p-qrow';
      const bodyHtml = q.math
        ? `<span class="qn">${toBangla(i+1)}।</span><div class="p-mathblock">${escapeHtml(q.text)}</div>`
        : `<span class="qn">${toBangla(i+1)}।</span> ${escapeHtml(q.text)}`;
      row.innerHTML = `
        <div class="p-qtext">${bodyHtml}</div>
        <div class="p-qmarks">${q.marks}</div>
      `;
      qwrap.appendChild(row);
    });
  }

  const arabicVal = document.getElementById('arabicline').value.trim();
  const footer = document.getElementById('pv-footer');
  footer.innerHTML = arabicVal ? `<div class="p-arabic">${arabicVal}</div>` : '';
}

document.getElementById('addQ').addEventListener('click', () => {
  questions.push({text:"", marks:"", math:false});
  renderEditor();
  renderPreview();
  updateTotals();
});

['institute','address','examname','classname','subject','time','fullmarks','arabicline'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    renderPreview();
    updateTotals();
  });
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  window.print();
});

// ---- Draft save/load (persists so you can come back later and finish writing) ----
const DRAFT_KEY = 'question-paper-draft';
const draftStatus = document.getElementById('draftStatus');
const fieldIds = ['institute','address','examname','classname','subject','time','fullmarks','arabicline'];

function collectDraft(){
  const fields = {};
  fieldIds.forEach(id => fields[id] = document.getElementById(id).value);
  return { fields, questions };
}

function applyDraft(draft){
  if(!draft) return;
  fieldIds.forEach(id => {
    if(draft.fields && draft.fields[id] !== undefined){
      document.getElementById(id).value = draft.fields[id];
    }
  });
  if(Array.isArray(draft.questions)){
    questions = draft.questions;
  }
  renderEditor();
  renderPreview();
  updateTotals();
}

async function saveDraft(){
  try{
    const data = JSON.stringify(collectDraft());
    const result = await window.storage.set(DRAFT_KEY, data, false);
    draftStatus.textContent = result ? 'খসড়া সেভ হয়েছে ✓' : 'সেভ করা যায়নি, আবার চেষ্টা করো।';
  }catch(err){
    draftStatus.textContent = 'সেভ করা যায়নি, আবার চেষ্টা করো।';
  }
  setTimeout(() => draftStatus.textContent = '', 3000);
}

async function loadDraft(silent){
  try{
    const result = await window.storage.get(DRAFT_KEY, false);
    if(result && result.value){
      applyDraft(JSON.parse(result.value));
      if(!silent) draftStatus.textContent = 'খসড়া লোড হয়েছে ✓';
      else draftStatus.textContent = 'আগের খসড়া থেকে লোড করা হয়েছে';
      setTimeout(() => draftStatus.textContent = '', 3000);
    } else if(!silent){
      draftStatus.textContent = 'কোনো সেভ করা খসড়া পাওয়া যায়নি।';
      setTimeout(() => draftStatus.textContent = '', 3000);
    }
  }catch(err){
    if(!silent){
      draftStatus.textContent = 'কোনো সেভ করা খসড়া পাওয়া যায়নি।';
      setTimeout(() => draftStatus.textContent = '', 3000);
    }
  }
}

document.getElementById('saveDraftBtn').addEventListener('click', saveDraft);
document.getElementById('loadDraftBtn').addEventListener('click', () => loadDraft(false));

renderEditor();
renderPreview();
updateTotals();

// Try to silently restore the last draft on open, if one exists
if(window.storage){
  loadDraft(true).catch(() => {});
}
</script>
